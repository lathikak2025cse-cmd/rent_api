<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RentEasy - Rent Payments</title>

    <link rel="stylesheet"
      href="/css/style.css">
</head>

<body>


<!-- =========================
     SIDEBAR
     ========================= -->

<aside class="sidebar">

    <div class="logo">
        🏠 RentEasy
    </div>

    <nav>

        <a href="index.html">
            📊 Dashboard
        </a>

        <a href="rooms.html">
            🏠 Rooms
        </a>

        <a href="tenants.html">
            👤 Tenants
        </a>

        <a href="assign.html">
            🔗 Assign Room
        </a>

        <a href="payments.html" class="active">
            💰 Rent Payments
        </a>

        <a href="dues.html">
            ⚠️ Dues
        </a>

        <a href="vacate.html">
            🚪 Vacate Tenant
        </a>

    </nav>

</aside>


<!-- =========================
     MAIN CONTENT
     ========================= -->

<main class="main-content">


    <!-- HEADER -->

    <header class="topbar">

        <h1>Rent Payments</h1>

        <p>
            Record and manage monthly rent payments
        </p>

    </header>


    <!-- =========================
         PAYMENT FORM
         ========================= -->

    <section class="form-card">

        <h2>Record Rent Payment</h2>


        <form id="paymentForm">


            <!-- TENANT -->

            <div class="form-group">

                <label for="tenantSelect">
                    Select Tenant
                </label>

                <select
                    id="tenantSelect"
                    required>

                    <option value="">
                        Loading tenants...
                    </option>

                </select>

            </div>


            <!-- MONTH -->

            <div class="form-group">

                <label for="month">

                    Rent Month

                </label>

                <input
                    type="month"
                    id="month"
                    required>

            </div>


            <!-- AMOUNT -->

            <div class="form-group">

                <label for="amount">

                    Rent Amount

                </label>

                <input
                    type="number"
                    id="amount"
                    placeholder="Enter rent amount"
                    min="1"
                    step="0.01"
                    required>

            </div>


            <button
                type="submit"
                class="primary-button">

                Record Payment

            </button>

        </form>


        <!-- MESSAGE -->

        <div
            id="paymentMessage"
            class="message">
        </div>

    </section>


    <!-- =========================
         PAYMENT HISTORY
         ========================= -->

    <section class="table-card">


        <div class="section-header">

            <div>

                <h2>Payment History</h2>

                <p>
                    All recorded rent payments
                </p>

            </div>


            <button
                class="secondary-button"
                onclick="loadPayments()">

                🔄 Refresh

            </button>

        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Tenant</th>

                        <th>Month</th>

                        <th>Amount</th>

                        <th>Payment Date</th>

                    </tr>

                </thead>


                <tbody id="paymentTableBody">

                    <tr>

                        <td colspan="5">
                            Loading payments...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>


</main>


<script src="js/app.js"></script>


<script>


/* ===================================
   LOAD TENANTS
   =================================== */

async function loadTenants() {

    const tenantSelect =
        document.getElementById(
            "tenantSelect"
        );


    try {

        const response =
            await fetch("/api/tenants");


        if (!response.ok) {

            throw new Error(
                "Failed to load tenants"
            );

        }


        const tenants =
            await response.json();


        tenantSelect.innerHTML = `
            <option value="">
                -- Select Tenant --
            </option>
        `;


        tenants.forEach(tenant => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                tenant.id;


            option.textContent =
                `${tenant.name}
                 (ID: ${tenant.id})`;


            tenantSelect.appendChild(
                option
            );

        });


        if (tenants.length === 0) {

            tenantSelect.innerHTML = `
                <option value="">
                    No tenants found
                </option>
            `;

        }


    } catch (error) {

        console.error(error);


        tenantSelect.innerHTML = `
            <option value="">
                Failed to load tenants
            </option>
        `;

    }

}


/* ===================================
   SET CURRENT MONTH
   =================================== */

function setCurrentMonth() {

    const today =
        new Date();


    const year =
        today.getFullYear();


    const month =
        String(
            today.getMonth() + 1
        ).padStart(2, "0");


    document.getElementById(
        "month"
    ).value =
        `${year}-${month}`;

}


/* ===================================
   LOAD ALL PAYMENTS
   =================================== */

async function loadPayments() {

    const tableBody =
        document.getElementById(
            "paymentTableBody"
        );


    try {

        const response =
            await fetch(
                "/api/payments"
            );


        if (!response.ok) {

            throw new Error(
                "Failed to load payments"
            );

        }


        const payments =
            await response.json();


        tableBody.innerHTML = "";


        if (payments.length === 0) {

            tableBody.innerHTML = `
                <tr>

                    <td colspan="5">
                        No payments recorded yet.
                    </td>

                </tr>
            `;

            return;

        }


        payments.forEach(payment => {


            const row =
                document.createElement(
                    "tr"
                );


            const tenantName =
                payment.tenant
                    ? payment.tenant.name
                    : "Unknown";


            row.innerHTML = `

                <td>
                    ${payment.id}
                </td>

                <td>
                    ${tenantName}
                </td>

                <td>
                    ${payment.month}
                </td>

                <td>
                    ₹${payment.amount}
                </td>

                <td>
                    ${payment.paymentDate}
                </td>

            `;


            tableBody.appendChild(row);

        });


    } catch (error) {

        console.error(error);


        tableBody.innerHTML = `

            <tr>

                <td colspan="5">

                    ❌ Failed to load payments.

                </td>

            </tr>

        `;

    }

}


/* ===================================
   RECORD PAYMENT
   =================================== */

document
    .getElementById("paymentForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const tenantId =
                document
                    .getElementById(
                        "tenantSelect"
                    )
                    .value;


            const month =
                document
                    .getElementById(
                        "month"
                    )
                    .value;


            const amount =
                document
                    .getElementById(
                        "amount"
                    )
                    .value;


            const message =
                document.getElementById(
                    "paymentMessage"
                );


            /* Basic validation */

            if (!tenantId ||
                !month ||
                !amount) {

                message.className =
                    "message error";


                message.textContent =
                    "❌ Please fill all fields.";


                return;

            }


            try {


                const response =
                    await fetch(
                        `/api/payments?tenantId=${tenantId}`,
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                month: month,

                                amount:
                                    Number(amount)

                            })

                        }
                    );


                /* Backend returns JSON
                   for successful payment */

                if (!response.ok) {


                    let errorMessage =
                        "Payment failed";


                    try {

                        const errorData =
                            await response.json();


                        if (errorData.message) {

                            errorMessage =
                                errorData.message;

                        }

                    } catch {

                        const text =
                            await response.text();

                        if (text) {

                            errorMessage =
                                text;

                        }

                    }


                    throw new Error(
                        errorMessage
                    );

                }


                const payment =
                    await response.json();


                message.className =
                    "message success";


                message.textContent =
                    "✅ Rent payment recorded successfully.";


                /* Clear amount */

                document.getElementById(
                    "amount"
                ).value = "";


                /* Reload payment table */

                loadPayments();


            } catch (error) {

                console.error(error);


                message.className =
                    "message error";


                message.textContent =
                    "❌ " + error.message;

            }

        }
    );


/* ===================================
   PAGE INITIALIZATION
   =================================== */

loadTenants();

setCurrentMonth();

loadPayments();


</script>


</body>

</html>
